<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tìm Bus Promax</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <!-- Thanh trên: tìm kiếm + tuyến đang xem -->
    <header class="top">
        <div class="card search-card">
            <div class="search-row">
                <button id="btn-home" class="logo" title="Về tuyến mặc định" aria-label="Về tuyến mặc định">
                    <img src="icon.png" alt="">
                </button>
                <input type="search" id="search-input" placeholder="Tìm số tuyến hoặc điểm dừng" autocomplete="off" enterkeyhint="search">
                <button id="btn-clear-search" class="icon-btn" hidden aria-label="Xoá">✕</button>
            </div>

            <div id="route-row" class="route-row" hidden>
                <button id="btn-route-info" class="route-name" title="Xem danh sách điểm dừng">
                    <span id="route-code" class="route-code">--</span>
                    <span id="route-title" class="route-title">Đang tải...</span>
                </button>
                <div class="segmented" role="tablist">
                    <button id="btn-dir-go" class="active">Đi</button>
                    <button id="btn-dir-ret">Về</button>
                </div>
                <button id="btn-set-default" class="icon-btn star" title="Đặt làm tuyến mặc định">☆</button>
            </div>

            <div id="saved-row" class="chips" hidden></div>
        </div>

        <div id="search-dropdown" class="card dropdown" hidden></div>

        <!-- Trạng thái cảnh báo đang bật (gộp cả canh xe đến trạm & canh xe xuất bến) -->
        <div id="status-alert" class="status-pill" hidden>
            <span id="status-alert-text"></span>
            <button id="btn-stop-alert" class="link-btn">Tắt</button>
        </div>
        <div id="status-departure" class="status-pill" hidden>
            <span id="status-departure-text"></span>
            <button id="btn-stop-departure" class="link-btn">Huỷ</button>
        </div>
    </header>

    <!-- Nút nổi trên bản đồ -->
    <div class="fab-group">
        <button id="btn-locate" class="fab" title="Vị trí của tôi" aria-label="Vị trí của tôi">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        </button>
        <button id="btn-open-sheet" class="fab" title="Danh sách xe & điểm dừng" aria-label="Danh sách">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            <span id="fab-bus-count" class="fab-badge" hidden>0</span>
        </button>
    </div>

    <!-- Thẻ trạm đang chọn: xe gần nhất & ETA -->
    <section id="focus-card" class="card focus-card" hidden>
        <div class="focus-head">
            <div class="focus-title">
                <div id="focus-name" class="focus-name"></div>
                <div class="focus-sub"><span id="focus-dir" class="dir-tag"></span> <span id="focus-route"></span></div>
            </div>
            <button id="btn-focus-fav" class="icon-btn star" title="Lưu trạm">☆</button>
            <button id="btn-focus-close" class="icon-btn" title="Bỏ chọn trạm" aria-label="Bỏ chọn trạm">✕</button>
        </div>
        <div class="focus-body">
            <div class="eta">
                <div id="focus-eta" class="eta-big">--</div>
                <div id="focus-detail" class="eta-detail"></div>
            </div>
            <div class="focus-actions">
                <button id="btn-focus-bus" class="btn" hidden>Xem xe</button>
                <button id="btn-focus-alert" class="btn btn-primary">Báo xe đến</button>
            </div>
        </div>
        <div id="focus-next" class="focus-next" hidden></div>
    </section>

    <!-- Danh sách (bottom sheet trên điện thoại, panel bên trái trên máy tính) -->
    <div id="sheet-backdrop" class="backdrop" hidden></div>
    <aside id="sheet" class="sheet" aria-hidden="true">
        <div class="sheet-head">
            <div class="tabs">
                <button class="tab active" data-tab="buses">Xe <span id="bus-count" class="count">0</span></button>
                <button class="tab" data-tab="stations">Điểm dừng <span id="station-count" class="count">0</span></button>
                <button class="tab" data-tab="info">Thông tin</button>
            </div>
            <button id="btn-close-sheet" class="icon-btn" aria-label="Đóng">✕</button>
        </div>
        <div class="sheet-body">
            <div id="pane-buses" class="pane active"><div class="empty">Chưa có xe nào đang chạy.</div></div>
            <div id="pane-stations" class="pane"></div>
            <div id="pane-info" class="pane">
                <div id="route-info"></div>
                <div class="version-row">
                    <span>Tìm Bus Promax <b id="app-version">--</b></span>
                    <button id="btn-check-update" class="btn">Kiểm tra cập nhật</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Hộp thoại cảnh báo (dùng chung cho "báo xe đến trạm" và "canh xe xuất bến") -->
    <div id="alert-modal" class="modal" hidden>
        <div class="card modal-card">
            <h3 id="alert-modal-title">Báo khi xe sắp đến</h3>
            <p id="alert-modal-target" class="muted"></p>

            <label id="distance-field" class="field">
                <span>Báo khi xe còn cách</span>
                <select id="alert-distance">
                    <option value="300">300 m (~1 phút)</option>
                    <option value="500" selected>500 m (~2 phút)</option>
                    <option value="1000">1 km (~3–4 phút)</option>
                    <option value="1500">1,5 km (~5 phút)</option>
                    <option value="2000">2 km (~7 phút)</option>
                </select>
            </label>

            <label class="toggle"><input type="checkbox" id="chk-call" checked><span>Mô phỏng cuộc gọi + giọng nói</span></label>
            <label class="toggle"><input type="checkbox" id="chk-sound" checked><span>Chuông</span></label>
            <label class="toggle"><input type="checkbox" id="chk-vibrate" checked><span>Rung</span></label>

            <div class="modal-actions">
                <button id="btn-test-alert" class="link-btn">Thử chuông</button>
                <span class="spacer"></span>
                <button id="btn-cancel-alert" class="btn">Huỷ</button>
                <button id="btn-activate-alert" class="btn btn-primary">Bật</button>
            </div>
        </div>
    </div>

    <!-- Hộp thoại cập nhật -->
    <div id="update-modal" class="modal" hidden>
        <div class="card modal-card">
            <h3 id="update-title">Cập nhật</h3>
            <div id="update-body"></div>
            <div class="modal-actions">
                <span class="spacer"></span>
                <button id="btn-cancel-update" class="btn">Để sau</button>
                <button id="btn-confirm-update" class="btn btn-primary">Cập nhật</button>
            </div>
        </div>
    </div>

    <!-- Màn hình mô phỏng cuộc gọi đến -->
    <div id="call-overlay" class="call-overlay" hidden>
        <div class="call-label">Cuộc gọi đến</div>
        <div class="call-avatar">🚌</div>
        <h2 id="call-name">Xe --</h2>
        <p id="call-sub"></p>
        <div id="call-status" class="call-status">Đang đổ chuông...</div>
        <div class="call-actions">
            <button id="btn-call-decline" class="call-btn decline" aria-label="Từ chối">✕</button>
            <button id="btn-call-accept" class="call-btn accept" aria-label="Trả lời">✆</button>
        </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="loading" class="loading" hidden><div class="spinner"></div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="geo.js"></script>
    <script src="app.js"></script>
</body>
</html>
